<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini-boutique</title>
  </head>
  <body>
    <header class="entete">
      <h1>Mini-boutique</h1>
      <p>Panier : <span id="compteur">0</span> article(s)</p>
    </header>

    <main class="page">
      <section>
        <div class="filtres">
          <input type="search" id="recherche" placeholder="Rechercher un produit" />
          <select id="filtre-categorie">
            <option value="toutes">toutes</option>
            <option value="vetements">vetements</option>
            <option value="chaussures">chaussures</option>
            <option value="accessoires">accessoires</option>
            <option value="maison">maison</option>
          </select>
        </div>

        <div id="catalogue" class="grille"></div>
      </section>

      <aside class="panier">
        <h2>Mon panier</h2>
        <ul id="lignes-panier"></ul>
        <p class="total">Total : <strong id="total">0</strong> F CFA</p>
      </aside>
    </main>
  </body>
  <!--pied de page-->
<footer>
  <p>&copy; 2026 - Binetou seck</p>
</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
